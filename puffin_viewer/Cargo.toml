[package]
name = "puffin_viewer"
version = "0.22.0"
authors = ["Embark <opensource@embark-studios.com>"]
categories = ["development-tools::profiling", "gui"]
description = "Viewer GUI for puffin profiler data"
edition.workspace = true
homepage = "https://github.com/EmbarkStudios/puffin"
keywords = ["profiler", "instrumentation", "gamedev"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EmbarkStudios/puffin"
rust-version.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md", "icon.png"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
puffin_egui = { path = "../puffin_egui", features = ["serde"] }
puffin = { path = "../puffin", features = ["serialization"] }
puffin_http = { path = "../puffin_http" }

argh = "0.1"
eframe = { version = "0.32", default-features = false, features = [
	"default_fonts",
	"glow",
	"persistence",
] }
log = "0.4"
rfd = "0.15"
env_logger = "0.11"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.33"
