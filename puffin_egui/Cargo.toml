[package]
name = "puffin_egui"
version = "0.29.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
categories = ["development-tools::profiling", "game-development", "gui"]
description = "Show puffin profiler flamegraph in-game using egui"
edition.workspace = true
homepage = "https://github.com/EmbarkStudios/puffin"
keywords = ["profiler", "gamedev", "gui"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EmbarkStudios/puffin"
rust-version.workspace = true
include = [
	"../LICENSE-APACHE",
	"../LICENSE-MIT",
	"**/*.rs",
	"Cargo.toml",
	"README.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = { version = "0.32.0", default-features = false }
egui_extras = { version = "0.32.0", default-features = false, features = [
	"serde",
] }
indexmap = { version = "2.1.0", features = ["serde"] }
natord = "1"
once_cell = "1"
parking_lot = "0.12"
puffin = { path = "../puffin", features = ["packing"] }
serde = { version = "1.0", features = ["derive"], optional = true }
time = { version = "0.3", default-features = false, features = [
	"formatting",
	"macros",
] }
vec1 = "1"
web-time = "1"

[dev-dependencies]
eframe = { version = "0.32.0", default-features = false, features = [
	"default_fonts",
	"glow",
	"persistence",
] }
